; PHP limits for admin image uploads (up to 16MB, see ImageOptimizer::MAX_UPLOAD_KB).
; Read by PHP-FPM / CGI hosts (most shared hosting, cPanel). Apache mod_php uses .htaccess.
; post_max_size must be larger than upload_max_filesize (the request has other fields too).
upload_max_filesize = 16M
post_max_size = 20M
; Decoding a large photo needs ~4 bytes per pixel (6000×6000 ≈ 144MB) plus resized copies.
memory_limit = 512M
